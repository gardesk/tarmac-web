# tarmac.musicsian.com nginx configuration
#
# Setup (AlmaLinux/RHEL):
#   sudo cp nginx.conf /etc/nginx/conf.d/tarmac.musicsian.com.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d tarmac.musicsian.com

server {
    server_name tarmac.musicsian.com;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Logging
    access_log /var/log/nginx/tarmac.access.log;
    error_log /var/log/nginx/tarmac.error.log;

    # Next.js application (reverse proxy)
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Static assets with long cache
    location /_next/static {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Install script - serve directly with correct MIME type
    location = /install.sh {
        alias /var/www/tarmac.musicsian.com/current/public/install.sh;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # Favicon caching
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3003;
        expires 1w;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }

    listen 80;
    listen [::]:80;
}
